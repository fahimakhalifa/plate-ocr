version: "3.9"

services:
  plate-ocr:
    build: .
    container_name: plate-ocr
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
    volumes:
      # Mount ONLY the weights (keeps image stable)
      - ./assets/models:/app/assets/models:ro
      - ./model:/app/model:ro
      - ./outputs:/app/outputs
